name: Pipeline de integração contínua  - Desafio Devops

on:
  push:
    branches: [ "main" ] # Aciona o pipeline a cada push na branch main

env:
  REGISTRY: docker.io
  IMAGE_NAME: eboa10/desafio-devops

jobs:
  build-scan-and-push:
    # uso da versão mais recente do Ubuntu fornecida pelo Github
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: 1. Fazer o checkout do código
        uses: actions/checkout@v4

      - name: Logar no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extrair metadadados para a imagem  Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,format=short

      - name: 2. Construir e Enviar a imagem Docker para Docker Hub
        id: build-and-push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: 3. Executar análise de vulnerabilidades (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'HIGH,CRITICAL' # Falha o pipeline se encontrar vulnerabilidades altas/críticas

      - name: Upload dos resultados do Trivy scan para GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'
